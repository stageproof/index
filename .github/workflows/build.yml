name: build

on:
  workflow_dispatch:
  schedule:
    # Starts only after this file is on main. Review charts.yaml before merging.
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.4"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: "v3.22.1"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/stageproof-index
            ~/.cache/stageproof/envtest
          key: index-${{ hashFiles('charts.yaml') }}
          restore-keys: index-

      - name: Build the index
        run: go run ./cmd/build -charts charts.yaml -o data
