name: build

# Schedule and manual runs only. A push to main does not publish an empty site.
on:
  workflow_dispatch:
    inputs:
      release_jumps:
        description: "For charts whose newest version changed, also jump to it from this many newest versions. 0 is the nightly command."
        default: "0"
        required: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

# A second run waits. Cancelling a run that has already uploaded its artifact
# makes the deploy report a missing artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.4"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: "v3.22.1"

      # Chart archives and envtest only. data/ is committed, and an older
      # cache that included it would replace the history on restore.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/stageproof-index
            ~/.cache/stageproof/envtest
          key: index-tools-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: index-tools-

      - name: Build the index
        env:
          RELEASE_JUMPS: ${{ github.event.inputs.release_jumps }}
        run: |
          set -euo pipefail
          args=(-charts charts.yaml -o data -max-pairs 1 -minors 1.35 -api-server auto)
          if [ -n "${RELEASE_JUMPS:-}" ] && [ "$RELEASE_JUMPS" != "0" ]; then
            args+=(-release-jumps "$RELEASE_JUMPS")
          fi
          go run ./cmd/build "${args[@]}"

      # The checkout is the history. New pair files exist only in this job
      # unless they are committed. Older files stay. Chart archives are not
      # committed. A run with no JSON change does not commit. REPORT.md is
      # regenerated from those files and committed with them.
      - name: Keep new reports
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          go run ./cmd/report -data data -o REPORT.md
          git add -- data/v1 REPORT.md
          staged=$(git diff --cached --name-only)
          if [ -z "$staged" ]; then
            echo "no report changes"
            exit 0
          fi
          bad=$(printf '%s\n' "$staged" | grep -E '\.(tgz|tar\.gz)$' || true)
          if [ -n "$bad" ]; then
            echo "refusing chart archives"
            printf '%s\n' "$bad"
            exit 1
          fi
          other=$(printf '%s\n' "$staged" | grep -v -E '^(data/v1/.*\.json|REPORT\.md)$' || true)
          if [ -n "$other" ]; then
            echo "refusing files outside data/v1 json and REPORT.md"
            printf '%s\n' "$other"
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Add the newest chart upgrade reports."
          git push origin HEAD:refs/heads/main || {
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' pull --rebase origin main
            git push origin HEAD:refs/heads/main
          }

      - name: Generate the site
        run: go run ./cmd/site -data data -o site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
