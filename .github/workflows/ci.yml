name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.4"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: "v3.22.1"

      - name: Install Stageproof v0.3.1
        run: |
          set -euo pipefail
          curl -fsSL -o stageproof.tar.gz https://github.com/stageproof/stageproof/releases/download/v0.3.1/stageproof_0.3.1_linux_amd64.tar.gz
          echo "7ff9fb4755aa13244aab631a9d525f5d22f95b5a865c23d27a3dbb8973b122dd  stageproof.tar.gz" | sha256sum -c
          tar -xzf stageproof.tar.gz stageproof
          echo "STAGEPROOF_BIN=$PWD/stageproof" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./... -count=1 -timeout 20m

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
