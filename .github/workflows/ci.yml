name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.4"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: "v3.22.1"

      - name: Install Stageproof v0.5.0
        run: |
          set -euo pipefail
          curl -fsSL -o stageproof.tar.gz https://github.com/stageproof/stageproof/releases/download/v0.5.0/stageproof_0.5.0_linux_amd64.tar.gz
          echo "4fa6b945b05386c9a3cfc5f9bea832668f0308df5f800ad1249a46f449f5279a  stageproof.tar.gz" | sha256sum -c
          tar -xzf stageproof.tar.gz stageproof
          echo "STAGEPROOF_BIN=$PWD/stageproof" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./... -count=1 -timeout 20m

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Test the badge worker
        run: node --test worker/src/index.test.js
