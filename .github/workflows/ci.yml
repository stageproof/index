name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: "v3.22.1"

      - name: Install Stageproof v0.5.2
        run: |
          set -euo pipefail
          curl -fsSL -o stageproof.tar.gz https://github.com/stageproof/stageproof/releases/download/v0.5.2/stageproof_0.5.2_linux_amd64.tar.gz
          echo "7f40de5f6a9a62a6721b2c750f1752975cfceffe4eb6e83041892c56cf39ae0c  stageproof.tar.gz" | sha256sum -c
          tar -xzf stageproof.tar.gz stageproof
          echo "STAGEPROOF_BIN=$PWD/stageproof" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./... -count=1 -timeout 20m

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0

  product-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.4"

      - name: Compare the header with the live product site
        env:
          STAGEPROOF_CHECK_PRODUCT_NAV: "1"
        run: go test ./internal/site/ -count=1 -run TestHeaderMatchesTheLiveProductSite -v

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Test the badge worker
        run: node --test worker/src/index.test.js
